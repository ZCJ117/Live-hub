# 服务器配置
server:
  port: 8081 # 网关服务端口，所有外部请求统一通过此端口进入

# Spring 配置
spring:
  # 本地凭据（SPEC-06 G8）：optional 保证文件缺失时不阻塞启动；环境变量优先级更高，可覆盖
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # 云服务配置
  cloud:
    # 网关配置
    gateway:
      # 路由规则配置
      routes:
        # 用户服务路由
        - id: user-route # 路由唯一标识
          uri: lb://user-service # 目标服务URI，lb://表示使用负载均衡，user-service是服务名称
          predicates: # 路由断言，匹配条件
            - Path=/user/** # 路径匹配，匹配以/user/开头的请求
        # 商户服务路由
        - id: shop-route
          uri: lb://shop-service
          predicates:
            - Path=/shop/**,/shop-type/** # 匹配以/shop/或/shop-type/开头的请求
        # 优惠券服务路由
        - id: voucher-route
          uri: lb://voucher-service
          predicates:
            - Path=/voucher/** # 匹配以/voucher/开头的请求
        # 订单服务路由 - 券订单（VoucherOrderController，agent-service 的 OrderFeignClient 亦复用此路径）
        - id: order-voucher-route
          uri: lb://order-service
          predicates:
            - Path=/voucher-order/** # 匹配以/voucher-order/开头的请求
        # 订单服务路由 - 秒杀一致性运维接口
        - id: order-seckill-consistency-route
          uri: lb://order-service
          predicates:
            - Path=/seckill/consistency/** # 匹配以/seckill/consistency/开头的请求
        # 社交服务路由
        - id: social-route
          uri: lb://social-service
          predicates:
            - Path=/blog/**,/follow/**,/notification/** # 匹配以/blog/、/follow/或/notification/开头的请求
        # RAG知识库服务路由
        - id: rag-route
          uri: lb://rag-service
          predicates:
            - Path=/api/rag/**
        # 智能客服Agent服务路由
        - id: agent-route
          uri: lb://agent-service
          predicates:
            - Path=/agent/**
      # 全局跨域配置
      globalcors:
        add-to-simple-url-handler-mapping: true # 是否将跨域配置添加到SimpleUrlHandlerMapping
        cors-configurations:
          '[/**]': # 匹配所有路径
            # 显式白名单（SPEC-06 §5.6）：'*' 与 allow-credentials: true 并存是无效且不安全的组合，
            # Spring 会回显请求 Origin，等同允许任意站点携带用户凭证发起跨域请求
            allowed-origin-patterns: 'http://localhost:8080,http://127.0.0.1:8080'
#            allowed-origins: '*' # 允许所有来源
            allowed-headers: '*' # 允许所有请求头
            allowed-methods: '*' # 允许所有请求方法
            allow-credentials: true # 允许携带凭证（如Cookie）
  # Redis 配置（Sa-Token 会话持久化）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0 # 必须与业务服务同库，否则 Sa-Token 会话无法跨服务识别（SPEC-10 §5.6）
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 0

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# 网关路径级限流（SPEC-14 P0-1）：按声明顺序逐条判定，任一超限即 429
hmdp:
  rate-limit:
    rules:
      # 原 AgentRateLimitFilter 的既有行为，迁入规则表（参数与其构造期默认值一致）
      - path-prefix: /agent/
        dimension: loginId
        capacity: 10
        refill-per-sec: 10
        message: 操作太频繁啦，请稍后再试
      # 秒杀入口 · 用户维度：5 QPS，防单账号脚本刷
      - path-prefix: /voucher-order/seckill/
        dimension: loginId
        capacity: 5
        refill-per-sec: 1
        message: 秒杀请求过于频繁，请稍后再试
      # 秒杀入口 · IP 维度：20 QPS，防多账号（二层叠加）
      - path-prefix: /voucher-order/seckill/
        dimension: ip
        capacity: 20
        refill-per-sec: 5
        message: 当前网络请求过于频繁，请稍后再试
  # 风控黑名单（SPEC-15 P2-2）：命中即 403，判定先于限流。
  # 黑名单数据在 Redis Set 中，运维维护：
  #   redis-cli SADD risk:blacklist:user <loginId>
  #   redis-cli SADD risk:blacklist:ip   <ip>
  risk:
    blacklist:
      path-prefixes:
        - /voucher-order/seckill/
      message: 当前账号或网络环境存在风险，已被限制访问