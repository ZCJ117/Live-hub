# Spring Boot 应用配置
spring:
  application:
    name: agent-service # 服务名称，用于服务注册和发现
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: public
      config:
        namespace: public
        file-extension: yaml
        import-check:
          enabled: false
  config:
    import: optional:nacos:${spring.application.name}.yaml
