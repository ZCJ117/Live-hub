# 服务器配置
server:
  port: 8084 # 服务端口，用于接收HTTP请求
  address: 127.0.0.1 # 仅绑定回环，业务端口不发布到公网（SPEC-06 §5.2）
  # Tomcat 线程池显式化（SPEC-15 P1-1）：默认值同为 200，显式声明是为消除
  # 「到底是没配还是配了 200」的歧义，并给阶梯压测一个可调的旋钮
  tomcat:
    threads:
      max: 200
    accept-count: 200

# Spring 配置
spring:
  # 本地凭据（SPEC-06 G8）：optional 保证文件缺失时不阻塞启动；环境变量优先级更高，可覆盖
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # 数据库驱动类名，MySQL 8.x 使用 com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/hmdp?useSSL=false&serverTimezone=Asia/Shanghai # 数据库连接URL，格式：jdbc:mysql://ip:port/数据库名?参数
    username: root # 数据库用户名
    password: ${MYSQL_PASSWORD:} # 数据库密码
    # 连接池显式化（SPEC-15 P1-1）：Hikari 默认 maximum-pool-size=10，
    # 在秒杀入口的高并发下是首要排队点；connection-timeout 压到 3s 使
    # 池耗尽时**快速失败**而非默认 30s 挂住 Tomcat 线程
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000
  # Redis 配置（统一使用 spring.redis 路径）
  data:
    redis:
     host: ${REDIS_HOST:localhost}  # Redis 主机地址，可用 REDIS_HOST 覆盖
     port: ${REDIS_PORT:6379} # Redis 端口，默认 6379
     password: ${REDIS_PASSWORD:} # Redis 密码
     database: 0 # Redis 库索引：全服务统一 DB 0，仅靠 key 前缀隔离（SPEC-10 §5.6）
    # Redis 连接池配置（使用 Lettuce 客户端）
     lettuce:
      pool:
        max-active: 50 # 最大活跃连接数（SPEC-15 P1-1：原 10 为压测拐点首要嫌疑）
        max-idle: 20 # 最大空闲连接数
        min-idle: 1 # 最小空闲连接数
        time-between-eviction-runs: 10s # 连接池空闲连接检测周期
  # Jackson JSON 处理配置
  jackson:
    default-property-inclusion: non_null # JSON序列化时忽略值为null的字段

# RocketMQ 配置
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: seckill-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# MyBatis Plus 配置
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 实体类别名扫描包，用于XML映射文件中简化类名
  mapper-locations: classpath*:/mapper/**/*.xml # Mapper XML文件扫描路径

# 日志配置
logging:
  level:
    com.hmdp: debug # 日志级别，debug 用于开发环境，生产环境建议调整为 info 或 warn

# Seata配置
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: my_test_tx_group
  registry:
    type: file
  config:
    type: file
  service:
    vgroupMapping:
      my_test_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
    disable-global-transaction: false
  data-source-proxy-mode: AT
  client:
    undo:
      log-serialization: jackson
      log-table: undo_log
    rm:
      report-success-enable: true
      table-meta-check-enable: false
      lock:
        retry-interval: 10
        retry-times: 30
        retry-policy-branch-rollback-on-conflict: true
    tm:
      default-global-transaction-timeout: 60000
      interceptor-order: 2147483647
  transport:
    shutdown:
      wait: 3
    thread-factory:
      boss-thread-prefix: NettyBoss
      worker-thread-prefix: NettyServerNIOWorker
      server-executor-thread-prefix: NettyServerBizHandler
      share-boss-worker: false
      client-selector-thread-prefix: NettyClientSelector
      client-worker-thread-prefix: NettyClientWorkerThread
      boss-thread-size: 1
      worker-thread-size: default
    type: TCP
    server: NIO
    heartbeat: true
    serialization: seata
    compressor: none

# 事务监控配置
#management:
#  endpoints:
#    web:
#      exposure:
#        include: seata,health,info
#  endpoint:
#    seata:
#      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: order-service

# Feign配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
      # SPEC-15 P1-4：只收紧 voucher-service 这一个 client。
      # 依据——order-service 对它的调用全部是内部端点（扣库存是单条 UPDATE、
      # 查库存/查券是单条 SELECT），真实耗时 ms 级；5s 的超时意味着
      # voucher-service 劣化时消费线程会被**逐个占满 5 秒**，吞吐崩塌而不是快速失败。
      # 不用 default 收紧是因为 default 会影响未来新增的其它 client（如查用户），
      # 那些调用的耗时特征不同，不该被一起改了。
      voucher-service:
        connectTimeout: 1000
        readTimeout: 2000

# 内部端点共享密钥（SPEC-06 §5.2）
hmdp:
  redisson:
    enabled: true # SPEC-10 §5.3：本服务使用 Redisson 分布式锁，显式开启
  internal-token: ${INTERNAL_TOKEN:}
  admin-user-ids: ${ADMIN_USER_IDS:}
  # 在途订单补偿器（SPEC-14 P0-2）
  seckill:
    compensate:
      timeout-seconds: 120   # 在途超时阈值：超过此时长仍未落库即触发补偿
      max-resend: 2          # 单条订单最大重投次数；耗尽后安全释放预扣

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

