server:
  port: 8087
  address: 127.0.0.1 # 仅绑定回环，业务端口不发布到公网（SPEC-06 §5.2）

#NOTE 这里向量数据库选择 PostgreSQL+pgvector(扩展),是用来存文档和向量的
spring:
  # 本地凭据（SPEC-06 G8）：optional 保证文件缺失时不阻塞启动；环境变量优先级更高，可覆盖
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver     # PostgreSQL 驱动
    url: jdbc:postgresql://${RAG_DB_HOST:localhost}:${RAG_DB_PORT:5433}/rag_db    # PostgreSQL 驱动
    username: ${RAG_DB_USER:rag_user}
    password: ${RAG_DB_PASSWORD}
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0 # Redis 库索引：全服务统一 DB 0，仅靠 key 前缀隔离（SPEC-10 §5.6）

mybatis-plus:
  type-aliases-package: com.hmdp.rag.entity

glm:
  api-key: ${GLM_API_KEY}
  base-url: https://open.bigmodel.cn/api/paas/v4
  llm-model: glm-4-flash
  embedding-model: embedding-2
  connect-timeout: 30s
  read-timeout: 120s
  max-retries: 3

rag:
  chunk:
    default-size: 500
    default-overlap: 50
  retrieval:
    default-top-k: 5
    max-top-k: 20
    rrf-k: 60
  conversation:
    max-history-turns: 10
  upload:
    dir: ${RAG_UPLOAD_DIR:./data/rag-uploads}
    max-size: 20MB

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  consumer:
    group: rag-doc-process-group
    topic: rag-document-process

logging:
  level:
    com.hmdp.rag: debug

# 内部端点共享密钥（SPEC-06 §5.2）
hmdp:
  # SPEC-10 §5.3：本服务使用 Redisson 分布式锁，显式开启
  redisson:
    enabled: true
  internal-token: ${INTERNAL_TOKEN:}

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
