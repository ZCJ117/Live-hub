version: '3.8'

services:
  postgres-rag:
    image: pgvector/pgvector:pg16
    container_name: postgres-rag
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-rag_password}
    volumes:
      - postgres_rag_data:/var/lib/postgresql/data
      - ./sql/init-rag.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL：业务主库，首次启动自动执行 docs/SQL/start.sql 建库建表
  mysql:
    image: mysql:8.0
    container_name: hmdp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-520117}
      MYSQL_DATABASE: hmdp
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/SQL/start.sql:/docker-entrypoint-initdb.d/start.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis：Sa-Token 会话共享与业务缓存
  redis:
    image: redis:7-alpine
    container_name: hmdp-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-520117}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-520117}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nacos：注册中心 + 配置中心（8848 主端口，9848/9849 为 gRPC 端口）
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: hmdp-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # RocketMQ NameServer：路由信息注册与发现
  rocketmq-namesrv:
    image: apache/rocketmq:4.9.4
    container_name: hmdp-rocketmq-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  # RocketMQ Broker：消息存储与投递，依赖 NameServer，配置取自 .e2e/rocketmq/broker.conf
  rocketmq-broker:
    image: apache/rocketmq:4.9.4
    container_name: hmdp-rocketmq-broker
    ports:
      - "10909:10909"
      - "10911:10911"
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - ./.e2e/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf

volumes:
  postgres_rag_data:
  mysql_data:
